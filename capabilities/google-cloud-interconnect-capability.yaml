naftiko: 1.0.0-alpha2
info:
  label: Google Cloud Interconnect API
  description: Provides programmatic access to manage interconnect connections, attachments, and locations for hybrid cloud
    connectivity between on-premises networks and Google Cloud.
  tags:
  - Google
  - Cloud
  - Interconnect
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-cloud-interconnect
    baseUri: https://compute.googleapis.com/compute/v1
    description: Google Cloud Interconnect API HTTP API.
    authentication:
      type: bearer
      token: '{{GOOGLE_CLOUD_INTERCONNECT_TOKEN}}'
    resources:
    - name: projects-project-global-interconnects
      path: /projects/{project}/global/interconnects
      operations:
      - name: listinterconnects
        method: GET
        description: Google Cloud Interconnect List interconnects
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createinterconnect
        method: POST
        description: Google Cloud Interconnect Create an interconnect
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-global-interconnects-interconne
      path: /projects/{project}/global/interconnects/{interconnect}
      operations:
      - name: getinterconnect
        method: GET
        description: Google Cloud Interconnect Get an interconnect
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: interconnect
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteinterconnect
        method: DELETE
        description: Google Cloud Interconnect Delete an interconnect
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: interconnect
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-regions-region-interconnectatta
      path: /projects/{project}/regions/{region}/interconnectAttachments
      operations:
      - name: listinterconnectattachments
        method: GET
        description: Google Cloud Interconnect List interconnect attachments
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: region
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-global-interconnectlocations
      path: /projects/{project}/global/interconnectLocations
      operations:
      - name: listinterconnectlocations
        method: GET
        description: Google Cloud Interconnect List interconnect locations
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: google-cloud-interconnect-rest
    description: REST adapter for Google Cloud Interconnect API.
    resources:
    - path: /projects/{project}/global/interconnects
      name: listinterconnects
      operations:
      - method: GET
        name: listinterconnects
        description: Google Cloud Interconnect List interconnects
        call: google-cloud-interconnect.listinterconnects
        with:
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/global/interconnects
      name: createinterconnect
      operations:
      - method: POST
        name: createinterconnect
        description: Google Cloud Interconnect Create an interconnect
        call: google-cloud-interconnect.createinterconnect
        with:
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/global/interconnects/{interconnect}
      name: getinterconnect
      operations:
      - method: GET
        name: getinterconnect
        description: Google Cloud Interconnect Get an interconnect
        call: google-cloud-interconnect.getinterconnect
        with:
          project: rest.project
          interconnect: rest.interconnect
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/global/interconnects/{interconnect}
      name: deleteinterconnect
      operations:
      - method: DELETE
        name: deleteinterconnect
        description: Google Cloud Interconnect Delete an interconnect
        call: google-cloud-interconnect.deleteinterconnect
        with:
          project: rest.project
          interconnect: rest.interconnect
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/regions/{region}/interconnectAttachments
      name: listinterconnectattachments
      operations:
      - method: GET
        name: listinterconnectattachments
        description: Google Cloud Interconnect List interconnect attachments
        call: google-cloud-interconnect.listinterconnectattachments
        with:
          project: rest.project
          region: rest.region
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/global/interconnectLocations
      name: listinterconnectlocations
      operations:
      - method: GET
        name: listinterconnectlocations
        description: Google Cloud Interconnect List interconnect locations
        call: google-cloud-interconnect.listinterconnectlocations
        with:
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: google-cloud-interconnect-mcp
    transport: http
    description: MCP adapter for Google Cloud Interconnect API for AI agent use.
    tools:
    - name: listinterconnects
      description: Google Cloud Interconnect List interconnects
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-interconnect.listinterconnects
      with:
        project: tools.project
      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: createinterconnect
      description: Google Cloud Interconnect Create an interconnect
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: google-cloud-interconnect.createinterconnect
      with:
        project: tools.project
      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: getinterconnect
      description: Google Cloud Interconnect Get an interconnect
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-interconnect.getinterconnect
      with:
        project: tools.project
        interconnect: tools.interconnect
      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      - name: interconnect
        type: string
        description: interconnect
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: deleteinterconnect
      description: Google Cloud Interconnect Delete an interconnect
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: google-cloud-interconnect.deleteinterconnect
      with:
        project: tools.project
        interconnect: tools.interconnect
      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      - name: interconnect
        type: string
        description: interconnect
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listinterconnectattachments
      description: Google Cloud Interconnect List interconnect attachments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-interconnect.listinterconnectattachments
      with:
        project: tools.project
        region: tools.region
      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      - name: region
        type: string
        description: region
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listinterconnectlocations
      description: Google Cloud Interconnect List interconnect locations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-interconnect.listinterconnectlocations
      with:
        project: tools.project
      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
