      description: Google Cloud Interconnect List interconnect locations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-interconnectlocations.listinterconnectlocations
      with:
        project: tools.project
      outputParameters:
      - type: object
        mapping: $.
