aid: google-cloud-interconnect
name: Google Cloud Interconnect
description: >-
  Google Cloud Interconnect provides high-bandwidth, low-latency connections between your on-premises network and Google
  Cloud, enabling hybrid cloud architectures through dedicated or partner interconnect options.
